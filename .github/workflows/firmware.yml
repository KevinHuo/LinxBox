name: Firmware checks

on:
  pull_request:
    paths:
      - "firmware/**"
      - "contracts/**"
      - ".github/workflows/firmware.yml"
  push:
    paths:
      - "firmware/**"
      - "contracts/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Firmware repository and host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 验证仓库、主机逻辑与真实 JSON 协议
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            set -e
            cd firmware
            ./tools/validate.sh --static

  build:
    name: ESP32-C3 构建与 C 覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 构建固件并验证自有 C 应用覆盖率
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            set -e
            cd firmware
            LINX_GATEWAY_BUILD=on ./tools/validate.sh --firmware
            apt-get update
            apt-get install -y --no-install-recommends clang-18 llvm-18 libclang-rt-18-dev
            CLANG=/usr/bin/clang-18 CLANGXX=/usr/bin/clang++-18 LLVM_COV=/usr/bin/llvm-cov-18 LLVM_PROFDATA=/usr/bin/llvm-profdata-18 ./tools/validate_coverage.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gateway/go.mod
      - name: 验证真实 TLS mock、LVGL 展示与共享协议报文
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install -r contracts/requirements.txt
          binaries=(firmware/build/coverage/run.*/host/linx_gateway_host)
          [[ ${#binaries[@]} -eq 1 ]]
          LINX_CONTRACT_PYTHON="$PWD/.venv/bin/python" ./firmware/tools/validate_gateway_mock.sh "$PWD/${binaries[0]}"
          LINX_CONTRACT_PYTHON="$PWD/.venv/bin/python" ./firmware/tools/validate_go_gateway.sh "$PWD/${binaries[0]}"
      - name: 保存覆盖率报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-c-coverage
          retention-days: 14
          path: |
            firmware/build/coverage/run.*/html/
            firmware/build/coverage/run.*/coverage.json
            firmware/build/coverage/run.*/summary.json
            firmware/build/coverage/run.*/report.txt
            firmware/build/gateway-mock/
